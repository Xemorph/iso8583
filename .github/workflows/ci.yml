name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ── Linux (GCC + Ninja) ────────────────────────────────────────────────────
  build-linux:
    name: Linux / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 g++-13 ninja-build libiconv-hook-dev
          echo "CC=gcc-13"  >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: '1f5e0348089e8a9b187f57d42866ebc871e815da'

      - name: Configure
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DISO8583_BUILD_SHARED=ON
          -DISO8583_ENABLE_ICONV=ON
          -DISO8583_BUILD_TESTS=ON
          -DISO8583_INSTALL=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --no-tests=error \
            --timeout 30

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-${{ matrix.build_type }}
          path: build/Testing/
          retention-days: 7

  # ── Linux (Clang + ASan) ─────────────────────────────────────────────────
  # Security-Plan 4.2: debug-asan pro PR. Minimale Abweichung vom bewaehrten
  # build-linux-Job: Compiler = clang (via CC/CXX), ASan-Flags nur fuer das
  # Projekt, Shared-Build + Standard-vcpkg-Triplet. Die vcpkg-Shared-Libs
  # werden durch die ASan-Runzeit per Interposition mitgeprueft (kein
  # vcpkg-Rebuild noetig).
  build-linux-asan:
    name: Linux (clang/ASan) / Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang ninja-build libiconv-hook-dev
          clang --version
          echo "CC=clang"     >> $GITHUB_ENV
          echo "CXX=clang++"  >> $GITHUB_ENV

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: '1f5e0348089e8a9b187f57d42866ebc871e815da'

      - name: Configure (ASan)
        run: >
          cmake -B build-asan
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug
          -DISO8583_BUILD_SHARED=ON
          -DISO8583_ENABLE_ICONV=ON
          -DISO8583_BUILD_TESTS=ON
          -DISO8583_INSTALL=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          -DCMAKE_SHARED_LIBRARY_LINK_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test (ASan)
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          ctest --test-dir build-asan \
            --output-on-failure \
            --no-tests=error \
            --timeout 60

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-asan-Debug
          path: build-asan/Testing/
          retention-days: 7

  # ── Linux (Clang + TSan) ─────────────────────────────────────────────────
  # Security-Plan 4.2: TSan pro PR (nur Linux). Minimale Abweichung vom
  # build-linux-Job: clang + TSan-Flags fuer das Projekt, Shared-Build +
  # Standard-Triplet. (Das lokale linux-tsan-Preset bleibt fuer die Dev-
  # Nutzung; die CI verwendet explizite Flags, damit Projekt und vcpkg-
  # Shared-Libs konsistent bleiben.)
  build-linux-tsan:
    name: Linux (clang/TSan) / Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang ninja-build libiconv-hook-dev
          echo "CC=clang"     >> $GITHUB_ENV
          echo "CXX=clang++"  >> $GITHUB_ENV

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: '1f5e0348089e8a9b187f57d42866ebc871e815da'

      - name: Configure (TSan)
        run: >
          cmake -B build-tsan
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug
          -DISO8583_BUILD_SHARED=ON
          -DISO8583_ENABLE_ICONV=ON
          -DISO8583_BUILD_TESTS=ON
          -DISO8583_INSTALL=OFF
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LIBRARY_LINK_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test (TSan)
        run: |
          TSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-tsan \
            --output-on-failure \
            --no-tests=error \
            --timeout 60

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-tsan-Debug
          path: build-tsan/Testing/
          retention-days: 7


  # ── Windows (MSVC + Ninja) ─────────────────────────────────────────────────
  build-windows:
    name: Windows / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: '1f5e0348089e8a9b187f57d42866ebc871e815da'

      - name: Configure
        shell: cmd
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DISO8583_BUILD_SHARED=ON
          -DISO8583_ENABLE_ICONV=ON
          -DISO8583_BUILD_TESTS=ON
          -DISO8583_INSTALL=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          --output-on-failure
          --no-tests=error
          --timeout 30

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-${{ matrix.build_type }}
          path: build/Testing/
          retention-days: 7

  # ── Windows (MSVC + ASan, statisch) ──────────────────────────────────────
  # Security-Plan 4.2: debug-asan pro PR. MSVC /fsanitize=address mit
  # statischer CRT (/MTd) + x64-windows-static-Triplet + statischem iso8583
  # (das debug-asan-Preset setzt das; ASan-Runzeit statisch verlinkt, daher
  # kein DLL-Suche-Problem unter ctest).
  build-windows-asan:
    name: Windows (MSVC/ASan) / Debug
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: '1f5e0348089e8a9b187f57d42866ebc871e815da'

      - name: Configure (ASan-Preset)
        shell: cmd
        run: cmake --preset debug-asan

      - name: Build
        shell: cmd
        run: cmake --build build/debug-asan --parallel

      - name: Test (ASan)
        shell: cmd
        run: >
          ctest --test-dir build/debug-asan
          --output-on-failure
          --no-tests=error
          --timeout 60

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-asan-Debug
          path: build/debug-asan/Testing/
          retention-days: 7


  # ── Zusammenfassung für Branch-Protection ──────────────────────────────────
  # Settings → Branches → Required status checks: "CI passed"
  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [ build-linux, build-linux-asan, build-linux-tsan, build-windows, build-windows-asan ]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "$ACT" = "true" ]; then
            echo "Running under act – skipping result check"
            exit 0
          fi
          jobs="${{ toJSON(needs) }}"
          echo "$jobs"
          if echo "$jobs" | grep -q '"result": "failure"' || echo "$jobs" | grep -q '"result": "cancelled"'; then
            echo "Failed: $jobs"
            exit 1
          fi
          echo "All jobs passed"
